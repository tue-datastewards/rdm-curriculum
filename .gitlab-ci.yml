stages:
  - validate
  - deploy

default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

variables:
  # GitLab Pages project sites are served from /<project>/. If the project is
  # nested in a subgroup or uses a custom domain, override this CI/CD variable
  # in Settings → CI/CD → Variables.
  BASE_PATH: /$CI_PROJECT_NAME/
  npm_config_cache: .npm

validate:
  stage: validate
  script:
    - npm ci
    - npm run check
    - npx tsc --noEmit

pages:
  stage: deploy
  script:
    - npm ci
    - npm run build
    - mkdir -p public
    - cp -r dist/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
