id: M01
title: Introduction to Research Data Management and Data Management Plan
summary: Data management starts before you collect anything. Learn why plans
  matter, review a sample DMP, and draft your own.
description: What does it mean to manage data responsibly for research? How to
  create a data management plan? After this module, you will be able to identify
  good research data management practices and create a data management plan for
  your research.
duration: 45 min
level: introductory
learningPath: core
prerequisites: Any experience in doing academic research, such as a research
  project at a bachelor's, master's, or doctoral level.
published: true
milos:
  - id: M01.A
    statement: Explain the purpose and benefits of a Data Management Plan throughout
      the research data lifecycle.
    learnerTitle: Why data management matters
    learnerStatement: Explain how a data management plan helps you before, during
      and after your project.
    phase: in-session
    status: complete
    published: true
    cilos:
      - C1
      - C2
      - C5
    content: |
      Research data is the evidence your project is built on: measurements, code, documents, samples, and the files you create along the way. When it is well managed, your work is easier to verify, reuse and build on. When it is not, data gets lost, misunderstood, or becomes impossible to share.

      ## What counts as data

      It is tempting to think of data as spreadsheets and measurements. A more useful definition: **data is anything you use as evidence for a claim**. That includes samples and specimens, interview recordings, code, notebooks, images, survey instruments and the files you generate along the way.

      Data is also *made*, not simply given. Someone chose the instrument, the categories, the time window and the file format. That context is what makes the data interpretable later — and it is exactly what a data management plan captures.

      ## What data management covers

      Research data management is how you **collect, organise, document, store, share and preserve** data during a project and after it ends. The decisions look different at each stage, but they are the same decisions: before you collect, while you work, and when the project closes.

      ## Why manage it well

      There are three common reasons to manage data well:

      - **Public good** — well-managed data can be reused by other researchers, and reuse avoids repeating costly data collection.
      - **Obligations** — the [TU/e RDM Policy](https://doi.org/10.5281/zenodo.15309046), funders, publishers and the Netherlands Code of Conduct for Research Integrity all expect it. Personal data brings legal obligations too.
      - **Future you** — you will be the first person who needs to understand your files six months from now. The same goes for your successor, your collaborators and reviewers.

      Good management also protects data from loss and corruption, makes verification and reproducibility possible, and gives data the status of a research output in its own right.

      ## What it costs when you don't plan

      Most data problems are ordinary: a lost laptop, a departing PhD candidate, a folder full of `final_v7.xlsx`. Estimates of time lost to clearing up data problems vary widely — some claims that researchers spend 80% of their time on data handling are overstated, but conservative estimates still put it at 40–50%. The exact number matters less than the pattern: unclear file names, undocumented steps and missing context cost time in every project.

      ## Data Management Plan

      A data management plan is how you avoid those problems. It is more than a bureaucratic document — it records the decisions you have made about your data and the ones you still need to make. It is not a prediction: start with what you know and revisit the plan as the project develops.
    teaching:
      teacher: >
        Prepare learning materials about defining research data and research
        data management (e.g. mention folder structure and file naming
        conventions — foreshadowing later course content).


        Present an activity: matching RDM solution cards (e.g. naming
        convention) with problem cards (e.g. "which file is the latest one?").
      learner: >
        Match each common data problem (such as "which file is the latest one?")
        with the RDM practice that prevents it.


        Then write down two benefits good data management would bring to your
        own project.
    activity:
      title: Match the problem to the practice
      instructions: >
        Each problem has one practice that prevents it. Drag a practice onto a
        problem, or tap a practice and then tap a problem. Check your answers
        when every problem has one.
      rounds:
        - title: Plan and document
          pairs:
            - problem: Your project arrives pre-built and undocumented.
              solution: Write an inventory and ask for a handover.
              explanation: >
                Before doing anything, write your own inventory: what each folder
                contains, which files are raw or processed, and what can be
                regenerated. Ask the predecessor or supervisor for a handover
                session and record it. Treat undocumented inherited data as
                unusable until you can trace it, and start documenting from your
                first new file onward.
            - problem: Every file is called final_v3_last_JB(1).xlsx.
              solution: Agree one naming convention and folder structure.
              explanation: >
                Fix one naming convention early — datatype, date, location,
                initials, version — and one folder structure, separating raw
                from processed data.
            - problem: Columns have no definitions, units or missing-value codes.
              solution: Write a README and a data dictionary.
              explanation: >
                Write a README at project level plus a data dictionary for
                tabular data: variable names, units, allowed values and
                missing-value codes. Use a metadata standard from your field
                where one exists, and Dublin Core as a fallback.
            - problem: The thesis RDM paragraph is written the week before submission.
              solution: Keep the DMP as a living document.
              explanation: >
                Keep the DMP as a living document from the start and update it at
                each chapter, so the thesis statement is a summary of something
                real rather than a retrospective guess. Many institutions
                require a data-management statement in the dissertation, and it
                has to describe what you actually did.
        - title: Store and control access
          pairs:
            - problem: The only copy is on one laptop or an external drive.
              solution: "Apply 3-2-1: three copies, two media, one offsite."
              explanation: >
                Apply 3-2-1: three copies, two media, one offsite. Check whether
                your institutional drive is actually backed up and how restore
                works; add an encrypted external or cloud copy if it isn't.
                Never let the only copy of raw data live on a personal machine.
            - problem: Only your supervisor knows where the data are.
              solution: Agree in writing who has access.
              explanation: >
                Establish in writing where project data live and who has access
                — not just who "owns" them. Ownership normally rests with the
                institution, not the individual, so confirm access arrangements
                before a departure, and document any arrangement for data on
                personal or lab systems.
            - problem: Interview recordings sit in a shared cloud folder.
              solution: Use secure storage and anonymise offline.
              explanation: >
                Agree the legal basis and consent wording at the start with your
                data protection officer or ethics committee, use institutional
                secure storage, encrypt removable media, and anonymise on an
                offline machine. If consent doesn't cover sharing, plan to share
                metadata or a controlled-access version instead.
        - title: Leave it usable
          pairs:
            - problem: Your contract ends and your accounts are switched off.
              solution: Deposit the data with a DOI before you leave.
              explanation: >
                Deposit the finished dataset in a repository before your
                contract ends, with a DOI, so it isn't dependent on your account.
                Ask IT or the data steward what happens to your storage on the
                end date, and arrange continuing access — or a supervisor-held
                copy — in advance.
            - problem: Only you can run the analysis code.
              solution: Version-control the code and record how to run it.
              explanation: >
                Version-control your scripts, record the software and package
                versions, and add a short "how to run this" note. Archive a
                snapshot of the code alongside the data when you publish, so a
                co-author or reviewer can reproduce the analysis behind a
                figure.
            - problem: The instrument software is the only way to open your files.
              solution: Convert to open formats and note the software.
              explanation: >
                Convert to open formats for preservation (CSV/TXT, TIFF/PNG,
                PDF/A), keep the proprietary original only where a tool needs
                it, and note in the README what software and version produced
                each file.
    notes: CILO codes normalized from "CLO1, CLO2, CLO5" in the source document.
      Resources and assessment are marked TBD in the source. The opening section
      was extended from the Data Stewardship Knowledgebase (CC BY 4.0) for this
      revision; the "80% of research time" claim was deliberately softened. The
      matching activity is built from the module's problem/solution table.
  - id: M01.B
    statement: Describe researcher responsibilities under TU/e policy, research
      integrity frameworks, requirements and funders and publishers.
    learnerTitle: What TU/e and funders expect from you
    learnerStatement: Describe the responsibilities that apply to your research
      data, before, during and after your project.
    phase: in-session
    status: complete
    published: true
    cilos:
      - C2
      - C3
    content: |
      Requirements are easier to handle when you place them on the timeline of your project.

      ## Before you collect

      - **A data management plan** — required by many funders, and part of the TU/e PhD process through Hora Finita. Research Cockpit holds the template and guidance.
      - **Ethics and privacy review** — if your data involves people, ethics approval and a privacy assessment come before collection starts. Anonymisation and pseudonymisation are design choices, not clean-up steps.
      - **Agreements and licences** — who owns the data, what you may do with third-party data, and how you will licence your own outputs.

      ## While you work

      - Store data on approved TU/e systems, not on a laptop or a personal cloud account.
      - Document what you collect and how you process it.
      - Control access: know who can see which files, and why.
      - Keep personal and sensitive data separate from the rest of the project.

      ## After the project

      - Deposit outputs in a repository, with a licence and persistent identifiers.
      - Respect retention periods and agreements: delete what must be deleted, keep what must be kept.
      - Leave documentation that lets someone else — including your successor — understand the data.

      ## Who can help

      Your **data steward**, the **privacy officer**, the **ethics committee**, **legal and IP support**, and the **library's RDM support**. Asking early is normal; asking after collection is expensive.
    teaching:
      teacher: >
        Module: what funders and TU/e expect from you — presented along the
        research data lifecycle: responsibilities and requirements before,
        during and after.
      learner: |
        Read the module.

        Then pick one obligation from each stage — before, during and after —
        and note who can help you meet it in your own project.
    resources:
      - label: TU/e RDM Handbook
        url: https://rdm.tue.nl/
        note: Guidance for before, during and after your research.
      - label: Netherlands Code of Conduct for Research Integrity
        url: https://www.knaw.nl/en/publications/netherlands-code-conduct-research-integrity-2027
      - label: TU/e RDM Policy
        url: https://doi.org/10.5281/zenodo.15309046
        note: Research Data Management Framework Policy, adopted by the Executive Board in 2025.
      - label: Publisher requirements
        note: Check the data availability policy of the journal you are targeting.
      - label: Privacy officer (DPO)
        note: Contact through your department or the TU/e privacy office.
    assessment: |
      Formative quiz (true or false), for example "Does TU/e have a data policy?" and "Can you opt out of funder requirements?".

      Then write down one obligation from each stage of your project and who can help you meet it.
    notes: "CILO mapping was blank in the revised matrix and is inferred from the
      previous version (CLO2, CLO3). Content newly written for this revision from
      the source outline and the Data Stewardship Knowledgebase (CC BY 4.0).
      TU/e-specific requirements still need confirmation by the curriculum team.
      Now published."
  - id: M01.C
    statement: Review a Data Management Plan for completeness, consistency, and
      alignment with project requirements.
    learnerTitle: Reviewing a data management plan
    learnerStatement: Check a DMP for completeness, consistency and alignment with
      your project's requirements.
    phase: in-session
    status: migrated
    published: true
    cilos:
      - C2
      - C3
      - C4
    content: |
      A DMP is only useful if it is read and used. Review yours at three moments: before you start, when your project changes, and when you prepare to share or archive your data.

      When you review a DMP, ask:

      - **Is it complete?** Are collection, storage, documentation, sharing and preservation all addressed?
      - **Is it consistent?** Do your storage and sharing choices match how sensitive the data is?
      - **Does it fit the project?** Are funder, publisher and institutional requirements covered?

      You will also use the plan in conversations with supervisors and collaborators, and when submitting it to systems such as Hora Finita, NWO or the European Commission.

      ## Review checklist

      Use these questions as evidence for your review:

      | Section | What to check |
      | --- | --- |
      | Collection and reuse | What data, from where, in which formats? Is existing data reused where possible? |
      | Documentation | What metadata, README or codebook will make this understandable in two years? |
      | Storage and backup | Which approved systems, who has access, and what happens if a laptop fails? |
      | Personal and sensitive data | Is there a legal basis, ethics approval, and a plan for anonymisation or access control? |
      | Sharing | What can be shared, under which licence, in which repository? |
      | Preservation | How long, where, and who is responsible after the project ends? |

      Common red flags are "to be decided later", no named storage system, no retention period, no owner for preservation, and sharing plans that contradict how sensitive the data is.
    teaching:
      teacher: >
        A champion case of a DMP — having a DMP helped the research. (We are
        still looking for this case.)
      learner: >
        Exchange your DMP with a peer. Review it against the three questions
        above and prepare written feedback using the rubric (compliant,
        transparent, reproducible).
    resources:
      - label: PhD Guidelines
        note: Available from your graduate school.
    assessment: >
      Peer review: give feedback on another participant's DMP using the rubric
      (compliant, transparent, reproducible). Use the feedback you receive to
      improve your own plan.
    notes: Migrated from the 2026-08-14 matrix (row "D. Review a DMP") and matched
      to this revised MILO. The review checklist and red flags were added for
      this revision.
  - id: M01.D
    statement: Create a Data Management Plan covering data collection, storage,
      documentation, sharing, and preservation.
    learnerTitle: Writing your data management plan
    learnerStatement: Draft a DMP covering collection, storage, documentation,
      sharing and preservation.
    phase: in-session
    status: migrated
    published: true
    cilos:
      - C1
      - C3
      - C4
      - C5
    content: |
      A DMP records the decisions you make about your data: what you will collect, where it will live, how it will be documented, who can access it, how long you will keep it, and what happens to it when the project ends.

      You do not need to have every answer on day one. Start with the decisions you know and revisit the plan as the project develops. Research Cockpit contains the TU/e template and guidance. Data stewards can help with specifics such as licences or choosing a repository.

      ## Questions to answer

      - **Collection and reuse** — Which data will you create, and which existing data will you reuse? In which formats?
      - **Documentation** — What will you write down so that the data and the steps that produced it are understandable later?
      - **Storage and backup** — Where will the data live during the project, who has access, and how are backups made? A common rule of thumb is 3-2-1: three copies, on two media, one off-site.
      - **Personal and sensitive data** — Does the project involve people? If so, what ethics approval, legal basis and access restrictions apply?
      - **Sharing** — What can be shared, with whom, under which licence, and in which repository?
      - **Preservation** — How long will the data be kept, where, and who is responsible after the project ends?

      Mark what is still open, and bring those questions to your supervisor or data steward.
    teaching:
      teacher: >
        Video: "DMP supports the research data lifecycle".


        Fill in the DMP in Research Cockpit (instructions are provided there).
        Reassure participants not to worry too much about specifics (e.g. which
        FAIR licence); they can ask data stewards.
      learner: >
        Fill in the DMP template in Research Cockpit for your own project.


        Then match each requirement card (for example FAIR data) with the DMP
        question it relates to, and note two topics you want to explore further.
    resources:
      - label: Research Cockpit
        url: https://cockpit.research.tue.nl
        note: TU/e DMP template and instructions. Login required.
      - label: TU/e RDM Handbook
        url: https://rdm.tue.nl/
        note: Practical guidance for before, during and after your research.
    assessment: >
      Submit your DMP in Research Cockpit. The matching exercise and your
      personal reflection are formative: they help you see which topics to
      explore next.
    notes: Migrated from the 2026-08-14 matrix (row "C. Create a DMP") and matched
      to this revised MILO. The question prompts, including the 3-2-1 backup rule
      of thumb, were added for this revision.
