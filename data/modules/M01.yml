    learnerTitle: What TU/e and funders expect from you
    learnerStatement: Describe the responsibilities that apply to your research
      data, before, during and after your project.
    phase: in-session
    status: draft
    published: false
    cilos:
      - C2
      - C3
    teaching:
      teacher: >
