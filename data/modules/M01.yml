id: M01
title: Introduction to Research Data Management and Data Management Plan
summary: Data management starts before you collect anything. Learn why plans
  matter, review a sample DMP, and draft your own.
description: What does it mean to manage data responsibly for research? How to
  create a data management plan? After this module, you will be able to identify
  good research data management practices and create a data management plan for
  your research.
duration: 45 min
level: introductory
learningPath: core
prerequisites: Any experience in doing academic research, such as a research
  project at a bachelor's, master's, or doctoral level.
published: true
milos:
  - id: M01.A
    statement: Explain the purpose and benefits of a Data Management Plan throughout
      the research data lifecycle.
    learnerTitle: Why data management matters
    learnerStatement: Explain how a data management plan helps you before, during
      and after your project.
    phase: in-session
    status: complete
    published: true
    cilos:
      - C1
      - C2
      - C5
    content: >
      Research data is the evidence your project is built on: measurements,
      code, documents, samples, and the files you create along the way. When it
      is well managed, your work is easier to verify, reuse and build on. When
      it is not, data gets lost, misunderstood, or becomes impossible to share.


      There are three common reasons to manage it well:


      - **Public good** — well-managed data can be reused by other researchers.

      - **Obligations** — TU/e policy, funders, publishers and the Netherlands
      Code of Conduct for Research Integrity all expect it.

      - **Future you** — you will be the first person who needs to understand
      your files six months from now.


      Most data problems are ordinary: a lost laptop, a departing PhD candidate,
      a folder full of `final_v7.xlsx`. A data management plan is how you avoid
      them. It is more than a bureaucratic document — it is the planning that
      keeps your data usable.


      "All plans are useless, but planning is everything."
    teaching:
      teacher: >
        Prepare learning materials about defining research data and research
        data management (e.g. mention folder structure and file naming
        conventions — foreshadowing later course content).


        Present an activity: matching RDM solution cards (e.g. naming
        convention) with problem cards (e.g. "which file is the latest one?").
      learner: >
        Match each common data problem (such as "which file is the latest one?")
        with the RDM practice that prevents it.


        Then write down two benefits good data management would bring to your
        own project.
    notes: CILO codes normalized from "CLO1, CLO2, CLO5" in the source document.
      Resources and assessment are marked TBD in the source.
  - id: M01.B
    statement: Describe researcher responsibilities under TU/e policy, research
