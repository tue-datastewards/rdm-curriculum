name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Project sites are served from /<repository-name>/. Override with "/" if the
  # site uses a custom domain at the root or an <owner>.github.io repository.
  BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Validates the curriculum data, type-checks, builds and writes the
      # GitHub Pages fallback files (404.html, .nojekyll).
      - run: npm run build

      # Pages is served from the gh-pages branch so that PR previews can live
      # under pr-preview/ (see preview.yml). clean-exclude keeps those previews
      # when a release replaces the site, and force: false rebases instead of
      # overwriting a preview commit that landed first.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: pr-preview/
          force: false
